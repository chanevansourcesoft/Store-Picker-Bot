# Physical constants for the 4WD mecanum robot. ONE place -- every script and launch file in
# mecanum_nav reads these, so a corrected measurement never has to be chased through code.
#
# Values below are taken from simulations/jetacker_description/urdf/mecanum_robot.urdf:
#   wheelbase      = 2 x 0.0875  (wheel joint x offsets)
#   track_width    = 2 x 0.0965  (wheel joint y offsets)
#   wheel_diameter = 2 x 0.040   (roller ring at 0.034 + roller radius 0.006; also why
#                                 base_footprint -> base_link is 0.040)
#
# These are NOT the Ackermann numbers. driver/controller/controller/ackermann.py uses
# wheelbase 0.213, track 0.222, wheel_diameter 0.101, and the mecanum.py in the working tree
# still carries 0.216 / 0.195 / 0.097 copied from it. Using those here inflates the rotation
# term by ~12% and under-converts m/s to rps by ~21%, so the robot drives slower than
# commanded and over-rotates -- and odometry calibration then chases a fault that is really
# just arithmetic.
#
# MEASURE AND CORRECT if the as-built robot differs: wheelbase and track centre-to-centre
# between wheel contact patches, wheel_diameter across the ROLLERS (the outer envelope the
# robot actually rolls on), not across the hub.

# Keyed on /** (any node name) rather than 'mecanum_base:'. ROS matches parameter YAML by
# node name, so a name-keyed block silently applies NOTHING if the node is ever renamed or
# namespaced -- and the node then runs on its in-code defaults with no warning. That bit
# once already: a test run under a different name fell back to invert_right -1.0 and the
# robot drove in a circle. Every other config in this workspace (ekf.yaml, slam.yaml) uses
# /** for the same reason.
/**:
  ros__parameters:
    wheelbase: 0.175          # m, front axle to rear axle
    track_width: 0.193        # m, left wheel to right wheel
    wheel_diameter: 0.080     # m, over the rollers

    # Motor id -> wheel, and per-wheel polarity. MEASURED 2026-10-22 on the floor, against
    # three sensors that agree with each other: rf2o (lidar, after the sllidar 'inverted' fix
    # that removed a left/right mirror), the IMU gyro for rotation, and the IMU accelerometer's
    # start/stop jolt for which way forward is.
    #     id 1 -> front-left  (reversed)     id 4 -> rear-left
    #     id 2 -> front-right                id 3 -> rear-right (reversed)
    # The 2026-10-21 map (FL=4 RL=1 FR=3 RR=2) was calibrated against the then-MIRRORED lidar:
    # forward and rotation were right, but strafe came out reversed (a commanded left slid
    # right). Swapping front and rear on each side, each motor keeping its polarity, fixes
    # strafe and leaves forward and rotation unchanged.
    # Do not trust calibrate_motor_mapping.py's ROTATION column at its default speed: the robot
    # turns ~3x faster than commanded and rf2o loses track (gyro +92 deg, rf2o +247 deg).
    # 2026-10-22, later: ROTATED 180 deg. Every calibration above measured motion with rf2o,
    # and rf2o was silently working in the LIDAR's frame, not base_footprint: it reads the
    # base->lidar transform once, on its first scan, and that lookup failed at startup
    # ("base_footprint does not exist"), so it assumed identity. The lidar faces backwards
    # (lidar_frame yaw pi, verified 2026-10-09), so those maps were right in the lidar's frame
    # and 180 deg wrong on the robot: w drove arm-first. Rotating moves every wheel to the
    # diagonally opposite corner (FL<->RR, RL<->FR) and reverses its forward direction.
    # Confirmed by eye: w now drives lidar side first. base.launch.py now feeds rf2o late.
    # 2026-10-22, last: LEFT and RIGHT swapped, each motor keeping its polarity. The rotation
    # sign used above came from the IMU gyro, and the IMU is mounted UPSIDE DOWN (accel z
    # -9.19 at rest; see imu_joint in mecanum_robot.urdf), so every "anticlockwise" in those
    # measurements was clockwise. By eye with the previous map: a slid RIGHT, j turned
    # CLOCKWISE, w was right. Swapping sides flips strafe and rotation and leaves forward alone.
    # OLD: FL=3(+1) RL=2(-1) FR=4(-1) RR=1(+1)   (2026-10-22, before the side swap)
    # OLD: FL=1(-1) RL=4(+1) FR=2(+1) RR=3(-1)                                     (2026-10-22)
    # OLD: id_front_left: 4, id_rear_left: 1, id_front_right: 3, id_rear_right: 2   (2026-10-21)
    # OLD: id_front_left: 4, id_rear_left: 2, id_front_right: 3, id_rear_right: 1   (2026-10-08)
    id_front_left: 4
    id_rear_left: 1
    id_front_right: 3
    id_rear_right: 2

    # PER-WHEEL inversion. Polarity belongs to the motor, so each one keeps its sign as it
    # changes side.
    # OLD: FL +1, RL -1, FR -1, RR +1   (2026-10-22, before the side swap)
    # OLD: FL -1, RL +1, FR +1, RR -1   (2026-10-22, before the 180 deg turn)
    # OLD: FL +1, RL -1, FR -1, RR +1   (2026-10-21)
    invert_front_left: -1.0
    invert_rear_left: 1.0
    invert_front_right: 1.0
    invert_rear_right: -1.0

    # Command limits applied in the base node, before the kinematics. The board itself has no
    # limiter, so this is the only thing standing between a bad command and a wall.
    max_linear_x: 0.5         # m/s forward/back
    max_linear_y: 0.4         # m/s strafe -- lower than x on purpose, see below
    max_angular_z: 2.0        # rad/s

    # Real speed per commanded speed. MEASURED 2026-10-26 on the floor, steady state (1-3 s of
    # a 3 s run): commanded vx 0.050 m/s -> 0.143 m/s by rf2o; commanded wz 0.150 rad/s ->
    # 0.618 rad/s by the gyro. mecanum_base divides every command by these, so nav2's speed is
    # the robot's speed. Without it the robot drove ~3x and turned ~4x faster than nav2
    # planned, so the collision monitor (0.9 s horizon) and the recoveries (0.25 s look-ahead)
    # braked and checked far too late: it hit some obstacles and missed others.
    # Strafe uses the linear gain (not measured separately). Re-measure after changing
    # wheels, motors or the board's motor settings. 1.0 = no correction.
    measured_linear_gain: 2.87
    measured_angular_gain: 4.12

    # Move along ONE axis at a time: drive, or strafe, or turn -- never a blend.
    # Nav2's controller always emits a mixed twist, which a holonomic base executes as a curve
    # in an arbitrary direction. With this true, only the largest component is executed, so the
    # robot travels in straight segments and switches axis between them.
    # Default ON because this is how the robot is wanted: straight segments, one axis at a
    # time. Turn it off for a run with  axis_lock:=false  if you want blended holonomic motion.
    axis_lock: true
    # Margin another axis must beat the running one by before the robot switches. Too low and
    # the two largest components swap every cycle near the crossover and the robot judders;
    # too high and it overshoots a turn before giving up the straight.
    axis_lock_hysteresis: 1.4

    # Stop the wheels if no command arrives for this long. Without it the board LATCHES the last
    # speed forever: kill a teleop mid-drive and the robot keeps going with nothing left running
    # to stop it. This is the single most important safety line in the file.
    cmd_vel_timeout: 0.5      # s
